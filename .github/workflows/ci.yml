name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'ai-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'ai-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# 1. Tự động hủy lượt chạy cũ khi có commit mới
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 2. Phát hiện các thư mục thay đổi để chỉ chạy job tương ứng
  detect-changes:
    name: Detect Changed Folders
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            ai-service:
              - 'ai-service/**'

  # --- FRONTEND CI ---
  frontend-ci:
    name: Frontend (Vite + React) CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

  # --- BACKEND CI ---
  backend-ci:
    name: Backend (NestJS) CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./backend

      - name: Quality Gate - Lint check
        run: npm run lint
        working-directory: ./backend

      - name: Run unit tests
        run: npm run test
        working-directory: ./backend

      - name: Build backend
        run: npm run build
        working-directory: ./backend

  # --- AI SERVICE CI ---
  ai-service-ci:
    name: AI Service (FastAPI) CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ai-service == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies & dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
        working-directory: ./ai-service

      - name: Quality Gate - Static Analysis & Lint (Ruff)
        run: ruff check .
        working-directory: ./ai-service

      - name: Python Syntax & Compilation Check
        run: python -m py_compile main.py
        working-directory: ./ai-service

  # --- DOCKER BUILD CHECK (Với GitHub Actions Layer Cache) ---
  docker-build-check:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-ci, backend-ci, ai-service-ci]
    if: always() && (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped') && (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped') && (needs.ai-service-ci.result == 'success' || needs.ai-service-ci.result == 'skipped') && (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai-service == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image (GHA Cache)
        if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.dev
          push: false
          tags: job-matching-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend Docker Image (GHA Cache)
        if: ${{ needs.detect-changes.outputs.backend == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.dev
          push: false
          tags: job-matching-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Service Docker Image (GHA Cache)
        if: ${{ needs.detect-changes.outputs.ai-service == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: job-matching-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
